name: Deploy Java BE with Docker Compose

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Bước này build sẵn file JAR để Dockerfile bên EC2 chỉ việc copy, giúp build nhanh hơn
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Đẩy toàn bộ thư mục (bao gồm target, Dockerfile, docker-compose.yml)
          source: "./*"
          target: "/home/${{ secrets.USERNAME }}/project-be"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/project-be
            
            # Tạo file cấu hình
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > .env
            printf '%s' '${{ secrets.FIREBASE_CONFIG }}' > serviceAccountKey.json
            
            # Tắt Buildx bằng biến DOCKER_BUILDKIT=0 và COMPOSE_DOCKER_CLI_BUILD=0
            docker-compose down
            export DOCKER_BUILDKIT=0
            export COMPOSE_DOCKER_CLI_BUILD=0
            docker-compose up --build -d