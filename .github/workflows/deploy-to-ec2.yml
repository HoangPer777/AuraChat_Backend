name: Deploy Java BE to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.USER }}/be"
          strip_components: 1

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.USER }}/be
            mkdir -p /home/${{ secrets.USER }}/be/src/main/resources
            printf '%s' "${{ secrets.FIREBASE_CONFIG }}" > /home/${{ secrets.USER }}/be/src/main/resources/serviceAccountKey.json
            printf '%s' "${{ secrets.ENV_FILE_CONTENT }}" > /home/${{ secrets.USER }}/be/.env
            JAR_NAME=$(ls -t *.jar | head -1)

            # Ensure pm2 is available; install Node.js + pm2 if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y curl
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get install -y nodejs
              sudo npm install -g pm2
            fi

            pm2 delete aura-be || true
            pm2 start "java -jar $JAR_NAME" --name "aura-be"
