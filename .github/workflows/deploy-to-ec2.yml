name: Deploy Java BE to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.USERNAME }}/be"
          strip_components: 1

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }} # PHẢI VIẾT THƯỜNG 'username'
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # Tạo các thư mục cần thiết
            mkdir -p /home/${{ secrets.USERNAME }}/be/src/main/resources
            
            # Ghi nội dung file cấu hình từ Secret
            # Lưu ý: Dùng dấu nháy đơn quanh Secret để tránh lỗi ký tự đặc biệt
            printf '%s' '${{ secrets.FIREBASE_CONFIG }}' > /home/${{ secrets.USERNAME }}/be/src/main/resources/serviceAccountKey.json
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > /home/${{ secrets.USERNAME }}/be/.env
            
            cd /home/${{ secrets.USERNAME }}/be
            JAR_NAME=$(ls -t *.jar | head -1)

            # Cài đặt PM2 nếu server chưa có (Dùng lệnh phù hợp với cả Amazon Linux và Ubuntu)
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo apt-get update -y || sudo dnf update -y
              sudo apt-get install -y nodejs npm || sudo dnf install -y nodejs
              sudo npm install -g pm2
            fi

            # Khởi động lại App
            pm2 delete aura-be || true
            pm2 start "export $(cat .env | xargs) && java -jar $JAR_NAME" --name "aura-be"