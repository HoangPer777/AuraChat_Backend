name: Deploy Java BE to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.USERNAME }}/be"
          strip_components: 1

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.USERNAME }}/be
            
            # 1. Ghi file JSON Firebase ra thư mục gốc để dễ đọc
            printf '%s' '${{ secrets.FIREBASE_CONFIG }}' > serviceAccountKey.json
            
            # 2. Ghi file .env thành file .properties để Java nạp trực tiếp (tránh lỗi export tiếng Việt)
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > application-env.properties
            
            # Lấy tên file JAR mới nhất
            JAR_NAME=$(ls -t *.jar | head -1)

            # 3. Cài đặt PM2 nếu chưa có
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo apt-get update -y || sudo dnf update -y
              sudo apt-get install -y nodejs npm || sudo dnf install -y nodejs
              sudo npm install -g pm2
            fi

            # 4. Chạy App: 
            # - Dùng --spring.config.import để nạp biến môi trường từ file sạch sẽ
            # - File serviceAccountKey.json lúc này nằm ngay thư mục gốc (root)
            pm2 delete aura-be || true
            pm2 start "java -jar $JAR_NAME --spring.config.import=optional:file:application-env.properties" --name "aura-be"