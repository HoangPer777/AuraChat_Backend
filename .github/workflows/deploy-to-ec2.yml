name: Deploy Java BE with Docker Compose

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Build JAR trên GitHub Actions; EC2 chỉ copy target/*.jar vào image (không build Maven lại).
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy Project to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Đẩy toàn bộ thư mục (bao gồm target, Dockerfile, docker-compose.yml)
          source: "./*"
          target: "/home/${{ secrets.USERNAME }}/project-be"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/project-be

            # Giải phóng dung lượng ổ đĩa (tránh "no space left on device")
            docker-compose down --remove-orphans 2>/dev/null || true
            docker image prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            docker container prune -f 2>/dev/null || true

            # Tạo file cấu hình
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > .env
            printf '%s' '${{ secrets.FIREBASE_CONFIG }}' > serviceAccountKey.json

            if ! ls target/*.jar >/dev/null 2>&1; then
              echo "ERROR: target/*.jar not found. GitHub Actions Maven build may have failed."
              exit 1
            fi

            # JAR đã build trên GitHub Actions — Dockerfile chỉ copy target/*.jar
            docker-compose up --build -d