name: Deploy Java BE to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/${{ secrets.USERNAME }}/be"
          strip_components: 1

      - name: Restart Application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}
            
            # 1. Tạo file config (vẫn cần thiết)
            printf '%s' '${{ secrets.ENV_FILE_CONTENT }}' > .env
            printf '%s' '${{ secrets.FIREBASE_CONFIG }}' > serviceAccountKey.json
            
            # 2. Chạy Docker Compose
            # Lệnh này sẽ dừng các container cũ, build lại và chạy ngầm (-d)
            docker-compose down
            docker-compose up --build -d