services:
  mongo:
    image: mongo:7.0
    container_name: aurachat-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: aurachat

  redis:
    image: redis:7.2-alpine
    container_name: aurachat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurachat-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json

# CHỈ KHAI BÁO CÁC NAMED VOLUMES CHO DATABASE Ở ĐÂY
volumes:
  mongo_data:
  redis_data:
