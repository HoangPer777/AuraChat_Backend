spring:
  application:
    name: aurachat-backend
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aurachat}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # Email (verification links)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 86400000 # 24 hours

imagekit:
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}

firebase:
  service-account-key-path: ${FIREBASE_SERVICE_ACCOUNT_KEY_PATH}

admin:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:https://aura-chat.io.vn}
