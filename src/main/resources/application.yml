spring:
  application:
    name: aurachat-backend
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aurachat}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  # OAuth2 - Google & Facebook
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email, public_profile

  # Email (Forgot Password OTP)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  access-token-expiry-ms: 86400000 # 24 hours

imagekit:
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}
